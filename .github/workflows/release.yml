name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test src/TheRegulator.Next.Tests/TheRegulator.Next.Tests.csproj --configuration Release

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            name: RegexEditor-win-x64
          - rid: linux-x64
            name: RegexEditor-linux-x64
          - rid: osx-x64
            name: RegexEditor-osx-x64
          - rid: osx-arm64
            name: RegexEditor-osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/TheRegulator.Next.Desktop/TheRegulator.Next.Desktop.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained
          /p:PublishSingleFile=true
          /p:PublishAot=false
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:DebugType=none
          --output publish/${{ matrix.name }}

      - name: Remove PDB files
        run: find publish/${{ matrix.name }} -name '*.pdb' -delete

      - name: Set executable permission
        if: ${{ !contains(matrix.rid, 'win') }}
        run: chmod +x publish/${{ matrix.name }}/TheRegulator.Next.Desktop

      - name: Zip artifact
        run: cd publish && zip -r ../${{ matrix.name }}.zip ${{ matrix.name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.zip
          generate_release_notes: true
